name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Install Arch packaging dependencies
        run: pacman -Syu --noconfirm --needed git rust namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the Arch package
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- packaging/arch/build.sh --cleanbuild --noconfirm
          namcap packaging/arch/PKGBUILD dist/*.pkg.tar.zst | tee "$RUNNER_TEMP/namcap.log"
          if grep -q ' E: ' "$RUNNER_TEMP/namcap.log"; then exit 1; fi
      - name: Verify the installed package
        shell: bash
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          fluxprod --check-config
          udevadm verify /usr/lib/udev/rules.d/70-antec-flux-pro-daemon.rules
          systemd-analyze verify /usr/lib/systemd/system/antec-flux-pro-daemon.service
          printf '\n# config preservation test\n' >> /etc/fluxprod.toml
          pacman -U --noconfirm dist/*.pkg.tar.zst
          grep -Fx '# config preservation test' /etc/fluxprod.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-linux-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
